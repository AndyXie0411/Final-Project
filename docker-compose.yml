version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - llm-network
    # Uncomment for CPU-only (adjust based on your CPU)
    environment:
      - OLLAMA_NUM_PARALLEL=4
      - OLLAMA_KEEP_ALIVE=24h
    # Limit resources for 16GB RAM
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 6G
    # Pull model on start
    command: >
      sh -c "
      ollama serve &
      sleep 5 &&
      ollama pull tinyllama &&
      wait
      "

  chatbot:
    build: .
    container_name: chatbot
    ports:
      - "5000:5000"
    volumes:
      - ./templates:/app/templates
      - ./sandbox:/app/sandbox
      - ./app.py:/app/app.py
    environment:
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=tinyllama
      - PORT=5000
      # Optional: Use smaller model for smolagents
      - SMOL_MODEL_ID=ollama_chat/tinyllama
      - SMOL_BASE_URL=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - llm-network
    # Limit resources
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

networks:
  llm-network:
    driver: bridge

volumes:
  ollama_data: