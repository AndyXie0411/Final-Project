version: "3.9"

services:
  chatbot:
    build: .
    container_name: chatbot
    ports:
      - "8080:8080"
    volumes:
      - ./templates:/app/templates
      - ./app.py:/app/app.py
    environment:
      - PORT=8080
    networks:
      - llm-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  llm-network:
    driver: bridge
